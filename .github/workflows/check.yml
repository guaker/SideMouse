name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check source and regressions
        run: ./scripts/check.sh
      - name: Build and verify application
        env:
          SIDEMOUSE_SIGNING_IDENTITY: '-'
          SIDEMOUSE_OUTPUT_DIR: dist
        run: ./build.sh
